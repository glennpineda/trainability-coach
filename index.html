<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#007BA7" />
    <title>Trainability Coach</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- ?v=5 since the logo kit of build 1.0.57 (?v=4 was 1.0.43, ?v=3 1.0.42, ?v=2 the redraw of 1.0.19): a phone
         keeps an icon by its address, so a new picture at the old address can
         be passed over. Raise the number, here and in the manifest, whenever
         the icon files change (as Studio does). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <!-- The name under the icon when Coach is added to a home screen (Glenn,
         17 Oct 2026: "Coach" only): Safari reads the first, Android the
         manifest's short_name. The tab keeps the full title. Opened from the
         icon, Coach fills the screen, as Studio does. -->
    <meta name="apple-mobile-web-app-title" content="Coach" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Coach" />
    <link rel="manifest" href="/manifest.webmanifest?v=5" />
    <!-- The fonts are imported in src/index.css (Roboto and Quicksand, as
         Studio); these only open the connections early. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
