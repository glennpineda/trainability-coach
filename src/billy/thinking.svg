<style>.head,.eyes,.mouth-wrap{transform-box:view-box}

.head{transform-origin:50px 92px;animation:tilt 3.4s infinite}
.pup{transform-box:fill-box;transform-origin:center;animation:gaze 3.4s infinite}
.eyes-l,.eyes-r{transform-box:fill-box;transform-origin:center;animation:squint 3.4s infinite}
.hmm{transform-box:fill-box;transform-origin:center;animation:hmm 3.4s infinite}
@keyframes tilt{0%,46%{transform:rotate(-4deg);animation-timing-function:ease-in-out} 58%,96%{transform:rotate(-2deg) translateY(-1px)} 100%{transform:rotate(-4deg)}}
@keyframes gaze{0%,38%{transform:translate(2.4px,-2.6px);animation-timing-function:ease-in-out} 52%,86%{transform:translate(-2.6px,-2.6px);animation-timing-function:ease-in-out} 96%,100%{transform:translate(2.4px,-2.6px)}}
@keyframes squint{0%,86%{transform:scaleY(.9)} 89%{transform:scaleY(.08)} 92%,100%{transform:scaleY(.9)}}
@keyframes hmm{0%,38%{transform:translateX(2px) rotate(-7deg);animation-timing-function:ease-in-out} 52%,86%{transform:translateX(-2px) rotate(7deg)} 96%,100%{transform:translateX(2px) rotate(-7deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

