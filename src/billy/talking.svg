<style>.head,.eyes,.mouth-wrap{transform-box:view-box}

.head{transform-origin:50px 92px;animation:sway 1.8s infinite}
.eyes-l,.eyes-r{transform-box:fill-box;transform-origin:center;animation:blink 1.8s infinite}
.talk{transform-box:fill-box;transform-origin:center top;animation:talk 1.8s infinite}
.w1,.w2,.w3{transform-box:fill-box;transform-origin:center}
.w1{animation:ow1 .9s infinite} .w2{animation:ow2 .9s infinite .1s} .w3{animation:ow3 .9s infinite .2s}
@keyframes sway{0%,100%{transform:rotate(2deg);animation-timing-function:ease-in-out} 50%{transform:rotate(-2deg) translateY(-1px)}}
@keyframes blink{0%,62%{transform:scaleY(1)} 65%{transform:scaleY(.08)} 68%,100%{transform:scaleY(1)}}
@keyframes talk{0%{transform:scaleY(.85)} 8%{transform:scaleY(1.45)} 16%{transform:scaleY(.5)} 26%{transform:scaleY(1.2)} 34%{transform:scaleY(.65)}
 44%{transform:scaleY(1.4)} 52%{transform:scaleY(.55)} 62%{transform:scaleY(1.15)} 70%{transform:scaleY(.7)} 80%{transform:scaleY(1.3)} 90%{transform:scaleY(.55)} 100%{transform:scaleY(.85)}}
@keyframes ow1{0%{opacity:0;transform:translateX(-2.5px) scale(.88)} 22%{opacity:1;transform:translateX(-1.6px) scale(.93)} 55%{opacity:.55;transform:translateX(-.6px) scale(.98)} 80%,100%{opacity:0;transform:translateX(.3px) scale(1.01)}}
@keyframes ow2{0%{opacity:0;transform:translateX(-2.5px) scale(.88)} 22%{opacity:.62;transform:translateX(-1.6px) scale(.93)} 55%{opacity:.34;transform:translateX(-.6px) scale(.98)} 80%,100%{opacity:0;transform:translateX(.3px) scale(1.01)}}
@keyframes ow3{0%{opacity:0;transform:translateX(-2.5px) scale(.88)} 22%{opacity:.34;transform:translateX(-1.6px) scale(.93)} 55%{opacity:.19;transform:translateX(-.6px) scale(.98)} 80%,100%{opacity:0;transform:translateX(.3px) scale(1.01)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

