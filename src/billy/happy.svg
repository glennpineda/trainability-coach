<style>.head,.eyes,.mouth-wrap{transform-box:view-box}

.head{transform-origin:50px 95px;animation:hop 1.6s infinite}
.grin{transform-box:fill-box;transform-origin:center top;animation:grin 1.6s infinite}
.tongue{transform-box:fill-box;transform-origin:center top;animation:tongue 1.6s infinite}
.hl,.hr{transform-box:fill-box;transform-origin:center;animation:squeeze 1.6s infinite}
.ray{transform-box:fill-box;transform-origin:50% 140%;animation:rays 1.6s infinite}
.sp{transform-box:fill-box;transform-origin:center}
.sp1{animation:pop 1.6s infinite} .sp2{animation:pop 1.6s infinite .14s} .sp3{animation:pop 1.6s infinite .28s}
@keyframes hop{
 0%{transform:translateY(0) scale(1.05,.93) rotate(-2deg);animation-timing-function:cubic-bezier(.2,.75,.4,1)}
 22%{transform:translateY(-8px) scale(.97,1.05) rotate(-3deg);animation-timing-function:cubic-bezier(.55,0,.85,.45)}
 44%{transform:translateY(0) scale(1.07,.92) rotate(0deg);animation-timing-function:cubic-bezier(.2,.75,.4,1)}
 66%{transform:translateY(-8px) scale(.97,1.05) rotate(3deg);animation-timing-function:cubic-bezier(.55,0,.85,.45)}
 88%{transform:translateY(0) scale(1.06,.93) rotate(2deg);animation-timing-function:ease-in-out}
 100%{transform:translateY(0) scale(1.05,.93) rotate(-2deg)}}
@keyframes grin{0%,100%{transform:scaleY(.9);animation-timing-function:ease-in-out} 22%{transform:scaleY(1.12)} 44%{transform:scaleY(.92)} 66%{transform:scaleY(1.12)}}
@keyframes tongue{0%,100%{transform:translateY(0.6px) scaleY(.9);animation-timing-function:ease-in-out} 22%{transform:translateY(-1.4px) scaleY(1.12)} 44%{transform:translateY(0.6px) scaleY(.9)} 66%{transform:translateY(-1.4px) scaleY(1.12)}}
@keyframes squeeze{0%,100%{transform:scaleY(1);animation-timing-function:ease-in-out} 22%{transform:scaleY(1.18) translateY(-.6px)} 44%{transform:scaleY(.94)} 66%{transform:scaleY(1.18) translateY(-.6px)}}
@keyframes rays{0%,100%{transform:scale(.76);opacity:.4;animation-timing-function:ease-in-out} 22%{transform:scale(1.1);opacity:1} 44%{transform:scale(.76);opacity:.4} 66%{transform:scale(1.1);opacity:1}}
@keyframes pop{0%,10%{transform:scale(0) rotate(0);opacity:0;animation-timing-function:cubic-bezier(.3,1.6,.5,1)}
 26%{transform:scale(1) rotate(28deg);opacity:1;animation-timing-function:ease-in-out} 52%,100%{transform:scale(0) rotate(56deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
