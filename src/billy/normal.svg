<style>.head,.eyes,.mouth-wrap{transform-box:view-box}

.head{transform-origin:50px 92px;animation:breathe 3.6s infinite}
.eyes-l,.eyes-r{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
.pup{transform-box:fill-box;transform-origin:center;animation:drift 3.6s infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1);animation-timing-function:ease-in-out} 50%{transform:translateY(-1.3px) scale(1.012)}}
@keyframes blink{0%,58%{transform:scaleY(1)} 61%{transform:scaleY(.08)} 64%,90%{transform:scaleY(1)} 92.5%{transform:scaleY(.08)} 95%,100%{transform:scaleY(1)}}
@keyframes drift{0%,22%{transform:translateX(0);animation-timing-function:ease-in-out} 36%,54%{transform:translateX(1.5px)} 68%,100%{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

