<style>.head,.eyes,.mouth-wrap{transform-box:view-box}

.head{transform-origin:50px 92px;animation:lean 2.8s infinite}
.eyes-l{transform-box:fill-box;transform-origin:center;animation:squintL 2.8s infinite}
.eyes-r{transform-box:fill-box;transform-origin:center;animation:wideR 2.8s infinite}
.browL,.browR,.flat,.q{transform-box:fill-box;transform-origin:center}
.browL{animation:browL 2.8s infinite} .browR{animation:browR 2.8s infinite}
.flat{animation:flat 2.8s infinite} .q{transform-origin:center bottom;animation:qw 2.8s infinite}
@keyframes lean{0%,40%{transform:rotate(5deg) scale(1);animation-timing-function:ease-in-out} 48%{transform:rotate(6.5deg) scale(1.03)} 56%{transform:rotate(5deg) scale(1)} 64%{transform:rotate(6.5deg) scale(1.03)} 74%,100%{transform:rotate(5deg) scale(1)}}
@keyframes squintL{0%,40%{transform:translateY(1.4px) scaleY(.56)} 48%{transform:translateY(1.8px) scaleY(.44)} 56%{transform:translateY(1.4px) scaleY(.56)} 64%{transform:translateY(1.8px) scaleY(.44)} 74%,100%{transform:translateY(1.4px) scaleY(.56)}}
@keyframes wideR{0%,40%{transform:translateY(-1px) scale(1.04)} 48%{transform:translateY(-1.8px) scale(1.08)} 56%{transform:translateY(-1px) scale(1.04)} 64%{transform:translateY(-1.8px) scale(1.08)} 74%,88%{transform:translateY(-1px) scale(1.04)} 91%{transform:translateY(-1px) scale(1.04,.1)} 94%,100%{transform:translateY(-1px) scale(1.04)}}
@keyframes browL{0%,40%{transform:translateY(0)} 48%{transform:translateY(1px) rotate(3deg)} 56%{transform:translateY(0)} 64%{transform:translateY(1px) rotate(3deg)} 74%,100%{transform:translateY(0)}}
@keyframes browR{0%,40%{transform:translateY(0)} 48%{transform:translateY(-2.4px)} 56%{transform:translateY(0)} 64%{transform:translateY(-2.4px)} 74%,100%{transform:translateY(0)}}
@keyframes flat{0%,40%{transform:translateX(2px) rotate(-9deg) scaleX(.8)} 48%{transform:translateX(2.4px) rotate(-12deg) scaleX(.72)} 56%{transform:translateX(2px) rotate(-9deg) scaleX(.8)} 64%{transform:translateX(2.4px) rotate(-12deg) scaleX(.72)} 74%,100%{transform:translateX(2px) rotate(-9deg) scaleX(.8)}}
@keyframes qw{0%,40%{transform:rotate(0);animation-timing-function:ease-in-out} 48%{transform:translateY(-3px) rotate(-11deg)} 56%{transform:rotate(0)} 64%{transform:translateY(-3px) rotate(11deg)} 74%,100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

