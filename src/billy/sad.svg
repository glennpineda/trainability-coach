 <g class="mouth-wrap"><path class="browL" d="M28.5 30 L43 27.4" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><path class="browR" d="M71.5 30 L57 27.4" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><path d="M41 68 Q50 60 59 68" fill="none" stroke="#2B0E3A" stroke-width="5.2" stroke-linecap="round" opacity=".18" transform="translate(0 1.6)"/><path class="frown" d="M41 68 Q50 60 59 68" fill="none" stroke="#fff" stroke-width="4.8" stroke-linecap="round"/><path class="tear" d="M31.4 53.6 Q34.2 57.5 34.2 59.6 A2.8 2.8 0 0 1 28.6 59.6 Q28.6 57.5 31.4 53.6 Z" fill="#fff"/></g>
