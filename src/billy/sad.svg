 <linearGradient id="bottomshade" x1="0" y1="0.42" x2="0" y2="1"><stop offset="0" stop-color="#2B0E3A" stop-opacity="0"/><stop offset="1" stop-color="#2B0E3A" stop-opacity=".28"/></linearGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <linearGradient id="ir" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#FFF3E2"/><stop offset="1" stop-color="#E9CDB4"/></linearGradient>
