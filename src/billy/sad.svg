 <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.1"/></filter>
 <filter id="drop" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="2.4" stdDeviation="2.6" flood-color="#3A1150" flood-opacity=".30"/></filter>
</defs>
<style>.head,.eyes,.mouth-wrap{transform-box:view-box}

.head{transform-origin:50px 96px;animation:sigh 3.4s infinite}
.eyes{animation:droop 3.4s infinite}
.eyes-l,.eyes-r{transform-box:fill-box;transform-origin:center;animation:lid 3.4s infinite}
.pup{transform-box:fill-box;transform-origin:center;animation:down 3.4s infinite}
.frown,.browL,.browR,.tear{transform-box:fill-box;transform-origin:center}
.frown{animation:quiver 3.4s infinite}
.tear{animation:tear 3.4s infinite;opacity:0}
@keyframes sigh{0%{transform:rotate(-2deg) translateY(1px);animation-timing-function:ease-in-out}
 18%{transform:rotate(-2deg) translateY(-1.6px) scale(1.02,1.03)}
 34%{transform:rotate(-2.5deg) translateY(2.4px) scale(1,.985);animation-timing-function:ease-in-out}
 72%{transform:rotate(-2deg) translateY(2px)} 100%{transform:rotate(-2deg) translateY(1px)}}
@keyframes droop{0%,100%{transform:translateY(1.4px);animation-timing-function:ease-in-out} 34%{transform:translateY(2.4px)}}
@keyframes lid{0%,100%{transform:scaleY(.8)} 34%{transform:scaleY(.72)} 60%{transform:scaleY(.8)} 63%{transform:scaleY(.08)} 66%{transform:scaleY(.8)}}
@keyframes down{0%,100%{transform:translateY(1.2px);animation-timing-function:ease-in-out} 34%{transform:translateY(1.8px)}}
@keyframes quiver{0%,30%{transform:scaleX(1);animation-timing-function:ease-in-out} 40%{transform:scaleX(.93) translateY(.6px)} 55%,100%{transform:scaleX(1)}}
@keyframes tear{0%,36%{opacity:0;transform:translateY(0) scale(.3)} 44%{opacity:1;transform:translateY(0) scale(1)}
 52%{opacity:1;transform:translateY(3px)} 78%{opacity:.85;transform:translateY(15px) scale(.9)} 88%,100%{opacity:0;transform:translateY(20px) scale(.75)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

